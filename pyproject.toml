[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaroute"
version = "0.1.0"
description = "Offline JSON Schema portability receipts for multi-provider LLM routes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ikteder"}]
keywords = ["llm", "json-schema", "structured-output", "reliability", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
schemaroute = "schemaroute.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
